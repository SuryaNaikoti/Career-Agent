<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle ambient halo -->
  <circle cx="256" cy="256" r="160" fill="#60A5FA" opacity="0.25" filter="url(#glow)"/>
  
  <!-- Primary AI Sparkle -->
  <path d="M256 96 C256 184 328 256 416 256 C328 256 256 328 256 416 C256 328 184 256 96 256 C184 256 256 184 256 96 Z" fill="url(#sparkle)"/>
  
  <!-- Secondary accent sparkle -->
  <path d="M376 136 C376 160 396 180 420 180 C396 180 376 200 376 224 C376 200 356 180 332 180 C356 180 376 160 376 136 Z" fill="#93C5FD"/>
</svg>
